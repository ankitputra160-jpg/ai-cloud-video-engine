name: 🎬 AI Documentary Video Production Pipeline

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'Documentary Subject / Topic'
        required: true
        default: 'The Secrets of Ancient Indian Astronomy'
      language:
        description: 'Narration Language'
        required: true
        default: 'hi'
        type: choice
        options:
          - en
          - hi
      duration:
        description: 'Target Duration in Seconds (10 - 1500 / 25 min)'
        required: true
        default: '60'
      resolution:
        description: 'Output Resolution'
        required: true
        default: '1080p'
        type: choice
        options:
          - 1080p
          - 4k
          - 720p
      style:
        description: 'Documentary Tone & Style'
        required: true
        default: 'Documentary'
        type: choice
        options:
          - Documentary
          - 2D Animation
          - Vox Explainer
          - Historical
          - Scientific
          - Biographical
      subtitle_style:
        description: 'Subtitle Styling Preset'
        required: false
        default: 'ass_karaoke'
        type: choice
        options:
          - ass_karaoke
          - pill_box
          - srt_classic
      voice_engine:
        description: 'Open-Source / Neural Voice Engine'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - fish
          - sarvam
          - cartesia
          - elevenlabs
          - piper
          - edge
      llm_mode:
        description: 'Script LLM Backend'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - gemini
          - groq
          - deterministic
      preview_only:
        description: 'Render 3-beat Hook preview only?'
        required: false
        default: false
        type: boolean
      storyboard_file:
        description: 'Optional Pre-Curated Storyboard JSON path'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  produce-documentary:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 🛠️ Install Multimedia, Pango, libass9 & Static Devanagari Fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg curl jq fontconfig fonts-dejavu-core fonts-noto-core fonts-lohit-deva libpango-1.0-0 libpangocairo-1.0-0 libharfbuzz0b libharfbuzz-dev libfribidi0 libfribidi-dev libraqm-dev libass9
          mkdir -p ~/.local/share/fonts
          cp -f fonts/*.ttf ~/.local/share/fonts/ || true
          fc-cache -fv | tail -n 10

      - name: 📦 Install Python Dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip3 install -r requirements.txt

      - name: 🧪 Run Automated Quality & Integrity Tests
        run: |
          PYTHONPATH=. python3 -m unittest discover -s tests -p "test_*.py"

      - name: 🎥 Execute End-to-End Documentary Pipeline
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          NASA_API_KEY: ${{ secrets.NASA_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          FISH_API_KEY: ${{ secrets.FISH_API_KEY }}
          FISH_REFERENCE_ID: ${{ secrets.FISH_REFERENCE_ID }}
          SARVAM_API_KEY: ${{ secrets.SARVAM_API_KEY }}
          CARTESIA_API_KEY: ${{ secrets.CARTESIA_API_KEY }}
          CARTESIA_VOICE_ID: ${{ secrets.CARTESIA_VOICE_ID }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
        run: |
          EXTRA_FLAGS=""
          if [ -n "${{ github.event.inputs.storyboard_file }}" ]; then
            EXTRA_FLAGS="$EXTRA_FLAGS --storyboard-file ${{ github.event.inputs.storyboard_file }}"
          fi
          if [ "${{ github.event.inputs.preview_only }}" = "true" ]; then
            EXTRA_FLAGS="$EXTRA_FLAGS --preview-only"
          fi
          PYTHONPATH=. python3 -m engine.pipeline \
            --topic "${{ github.event.inputs.topic }}" \
            --language "${{ github.event.inputs.language }}" \
            --duration "${{ github.event.inputs.duration }}" \
            --resolution "${{ github.event.inputs.resolution }}" \
            --style "${{ github.event.inputs.style }}" \
            --subtitle-style "${{ github.event.inputs.subtitle_style || 'ass_karaoke' }}" \
            --voice-engine "${{ github.event.inputs.voice_engine || 'auto' }}" \
            --llm-mode "${{ github.event.inputs.llm_mode || 'auto' }}" \
            $EXTRA_FLAGS \
            --thumbnail "output/thumbnail.jpg" \
            --output "output/documentary.mp4" \
            --work-dir ".workspace"

      - name: 📤 Upload Finished Documentary Video Artifact
        uses: actions/upload-artifact@v4
        with:
          name: documentary-${{ github.event.inputs.language }}-${{ github.run_number }}
          path: |
            output/documentary.mp4
            output/thumbnail.jpg
          retention-days: 14

      - name: 🚀 Publish Direct Mobile Download via GitHub Release (Up to 2 GB)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="doc-run-${{ github.run_number }}"
          gh release create "$TAG" output/documentary.mp4 output/thumbnail.jpg \
            --title "Documentary #${{ github.run_number }}: ${{ github.event.inputs.topic }}" \
            --notes "Automated mobile-friendly 1-tap download (bypasses Git 100 MB limit)."

      - name: 📊 Upload QC, Script & Production Manifest
        uses: actions/upload-artifact@v4
        with:
          name: production-dossier-${{ github.run_number }}
          path: |
            .workspace/qc_report.json
            .workspace/fact_sheet.json
            .workspace/script.json
            .workspace/storyboard.json
            .workspace/research_dossier.json
            .workspace/2d_script.md
            .workspace/subtitles.srt
            .workspace/subtitles.ass
          if-no-files-found: ignore
          retention-days: 14

      - name: 🏆 Job Completion Summary
        run: |
          echo "### 🎬 AI Documentary Generation Complete (v3.0)!" >> $GITHUB_STEP_SUMMARY
          echo "- **Topic:** ${{ github.event.inputs.topic }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Style:** ${{ github.event.inputs.style }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Voice Engine:** ${{ github.event.inputs.voice_engine || 'auto' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Language:** ${{ github.event.inputs.language }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Resolution:** ${{ github.event.inputs.resolution }}" >> $GITHUB_STEP_SUMMARY
          echo "- **File Size:** $(du -sh output/documentary.mp4 | cut -f1)" >> $GITHUB_STEP_SUMMARY
          echo "- **Release / Artifact:** https://github.com/${{ github.repository }}/releases/tag/doc-run-${{ github.run_number }}" >> $GITHUB_STEP_SUMMARY

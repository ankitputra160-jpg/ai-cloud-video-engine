name: 🎬 AI Cloud Video Generator

on:
  workflow_dispatch:
    inputs:
      topic:
        description: 'वीडियो का टॉपिक (e.g. bus restoration, car crafting, mini home)'
        required: true
        default: 'abandoned bus to luxury mini home'
      style:
        description: 'वीडियो स्टाइल'
        required: true
        default: 'ASMR Crafting'
        type: choice
        options:
          - ASMR Crafting
          - Documentary
          - Satisfying Tools
      duration:
        description: 'वीडियो लंबाई (seconds)'
        required: true
        default: '60'

jobs:
  generate-video:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🛠️ Install System Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg python3-pip curl jq
          pip3 install requests pexelsapi pillow

      - name: 🔍 Research & Download 4K Video Clips
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          TOPIC: ${{ github.event.inputs.topic }}
        run: |
          python3 scripts/download_clips.py "$TOPIC" "${{ github.event.inputs.duration }}"

      - name: 🎵 Generate ASMR Sound Effects
        run: |
          python3 scripts/generate_audio.py

      - name: 🎬 Render Final 16:9 Video
        run: |
          python3 scripts/render_video.py "${{ github.event.inputs.topic }}" "${{ github.event.inputs.style }}"

      - name: 📤 Upload Final Video as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: final-video-${{ github.run_number }}
          path: output/final_video.mp4
          retention-days: 7

      - name: ✅ Done - Video Ready!
        run: |
          SIZE=$(du -sh output/final_video.mp4 | cut -f1)
          DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 output/final_video.mp4 | cut -d. -f1)
          echo "🎉 Video Generation Complete!"
          echo "📁 File Size: $SIZE"
          echo "⏱️ Duration: ${DURATION}s"
          echo "📥 Download from the Actions > Artifacts section"
